# CI (T7.18): the same gates as `python dev.py check`, then the Playwright matrix + live Director run (`e2e`).
# Providers are not called in CI: the router replays cassettes and templates (no backend/.env).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: python dev.py setup
      - run: python dev.py gen-check lint typecheck
      - run: python dev.py test
      - run: python dev.py demo-check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: python dev.py setup
      - run: pnpm --filter frontend exec playwright install --with-deps chromium
      - run: python dev.py e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: frontend/e2e-output/
