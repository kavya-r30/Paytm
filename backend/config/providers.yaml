roles:
  # Azure OpenAI is the primary LLM (model = deployment name); Mistral's key is rate-limited (429) and its
  # large model is outside the key's tier (403), so it stays only as the OCR provider.
  llm.fast:
    chain:
      - { provider: azure, model: renaiscent-gpt-5.4-mini, timeout_ms: 12000, json: true }
      - { provider: groq, model: openai/gpt-oss-20b, timeout_ms: 2500, json: true }
      - { provider: cassette }
  llm.large:
    chain:
      - { provider: azure, model: renaiscent-gpt-5.4-mini, timeout_ms: 12000, json: true }
      - { provider: groq, model: openai/gpt-oss-120b, timeout_ms: 4000, json: true }
      - { provider: cassette }
  vision:
    chain:
      - { provider: azure, model: renaiscent-gpt-5.4-mini, timeout_ms: 12000 }
      - { provider: azure, model: renaiscent-gpt-4o, timeout_ms: 4000 }
      - { provider: cassette }
  ocr:
    chain:
      - { provider: mistral, model: mistral-ocr-latest, timeout_ms: 20000 }
      - { provider: sarvam, model: sarvam-vision, timeout_ms: 20000 }
      - { provider: cassette }
  stt:
    chain:
      - { provider: sarvam, model: 'saaras:v4', timeout_ms: 2500, langs: [hi, en, mr, ta, bn, gu, te] }
      - { provider: groq, model: whisper-large-v3, timeout_ms: 3000 }
  tts:
    chain:
      # each Bulbul model has its own speaker set; bulbul:v2 is deprecated by Sarvam
      - { provider: sarvam, model: 'bulbul:v4-flash', speaker: priya_hi_recovery, timeout_ms: 2000, langs: [hi, en, mr, ta, bn, gu, te] }
      - { provider: sarvam, model: 'bulbul:v3', speaker: priya, timeout_ms: 2000 }
      - { provider: cassette }
  translate:
    chain:
      - { provider: sarvam, model: sarvam-translate, timeout_ms: 2000 }
  guard:
    chain:
      - { provider: azure, model: renaiscent-gpt-5.4-mini, timeout_ms: 3000, json: true }
      - { provider: groq, model: openai/gpt-oss-20b, timeout_ms: 1000, json: true }
  persona:
    chain:
      - { provider: groq, model: openai/gpt-oss-20b, timeout_ms: 3000 }
      - { provider: cassette }
providers:
  azure: { api_key_env: AZURE_OPENAI_API_KEY, data_tag: merchant_ok_if_paid_plan }
  mistral: { api_key_env: MISTRAL_API_KEY, data_tag: merchant_ok_if_paid_plan }
  groq: { api_key_env: GROQ_API_KEY, data_tag: synthetic_only_on_free_tier }
  sarvam: { api_key_env: SARVAM_API_KEY, data_tag: merchant_ok_if_paid_plan, rate: { rpm: 60 } }
