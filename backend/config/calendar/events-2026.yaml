# Indian festivals and holidays, 2026. Spec Part D3 (calendar engine).
#
# scope:          national, or the states (ISO 3166-2:IN) / cities (regions.yaml) where the event drives demand.
# date_overrides: a different date in a given state (regional calendars).
# confidence:     published (government/bank list) · panchang (Hindu calendar sources agree) ·
#                 regional_variant (differs by region; override given or expected) · moon_sighting (Islamic; ±1 day) · tentative
# lead_days:      how many days before the event demand starts to build; tail_days: after.
# closure:        typical shop-hours effect (a hint the owner confirms; never applied automatically).
# priors:         per-pack category demand multipliers. Weak starting priors only: forecasts learn each shop's own
#                 festival effect from its history and shrink toward these when history is thin (cold start).
# Rule (spec CAL-5): applicability is by PLACE only. Arth never infers a customer's religion or community.
#
# Sources (checked 30 Oct 2026): hindu-blog.com Hindu festivals 2026 list; central/state government and bank 2026
# holiday lists (CAG Punjab, Maharashtra, Madhya Pradesh, Karnataka, Ladakh lists via search); RBI monthly holiday
# reports in news (Outlook Business, Angel One). Re-verify moon_sighting and tentative rows against official notices.

