# T2.11 acceptance: a 5-beat billing scenario, headless through the real API.
scenario: billing_smoke
title: Five-beat billing
pack: kirana
world: {days: 2, seed: 11, size: micro, patrons: 8}
scenes:
  - id: "1"
    title: Billing
    beats:
      - id: "1.1"
        cue: Open a bill and add loose sugar by voice
        input:
          - command: {type: counter.open_bill, payload: {}}
        save: {bill: data.bill_id}
      - id: "1.2"
        cue: "Teen sau ka cheeni: ₹30 of loose sugar"
        input:
          - command: {type: counter.add_lines, payload: {bill_id: "${bill}", lines: [{item_id: "${sugar_loose}", amount_paise: 3000, added_via: voice}]}}
        expect:
          - {view: "bill/${bill}", path: bill.total_paise, equals: 3000}
      - id: "1.3"
        cue: Customer pays the dynamic QR
        input:
          - persona_action: {persona: priya, action: pay_qr, bill: "${bill}"}
        expect:
          - {view: "bill/${bill}", path: bill.status, equals: closed}
          - {view: "bill/${bill}/paid", path: invoice.total_paise, equals: 3000}
      - id: "1.4"
        cue: Cash bill with change
        input:
          - command: {type: counter.open_bill, payload: {}}
        save: {cash_bill: data.bill_id}
      - id: "1.5"
        cue: Add a kilo and pay cash; books and invariants hold
        input:
          - command: {type: counter.add_lines, payload: {bill_id: "${cash_bill}", lines: [{item_id: "${sugar_loose}", qty_milli: 1000, added_via: tap}]}}
          - command: {type: counter.checkout, payload: {bill_id: "${cash_bill}", payments: [{mode: cash, amount_paise: 4500, tendered_paise: 5000}]}}
        expect:
          - {view: "bill/${cash_bill}", path: bill.status, equals: closed}
          - {view: trust, path: audit.ok, equals: true}
          - {invariants: true}
