scenario: edge_duplicate_webhook
title: Edge - the rails deliver the same webhook twice
pack: kirana
world: {days: 2, seed: 21, size: micro, patrons: 6}
scenes:
  - id: "1"
    title: Duplicate delivery is idempotent; a second real payment is flagged
    beats:
      - id: "1.1"
        cue: Fault injected, then a QR payment
        input:
          - fault: {rails: duplicate}
          - command: {type: counter.open_bill, payload: {}}
        save: {bill: data.bill_id}
      - id: "1.2"
        cue: Add and pay; the webhook arrives twice
        input:
          - command: {type: counter.add_lines, payload: {bill_id: "${bill}", lines: [{item_id: "${sugar_loose}", qty_milli: 1000, added_via: tap}]}}
          - persona_action: {persona: priya, action: pay_qr, bill: "${bill}"}
        expect:
          - {result: deliveries, len: 2}
          - {view: "bill/${bill}", path: bill.payments, len: 1}
      - id: "1.3"
        cue: Priya pays again by static QR - a duplicate payment, flagged with an R4 refund suggestion
        input:
          - persona_action: {persona: priya, action: pay_static, amount_paise: 4500}
        expect:
          - {view: hisaab, path: exceptions.0.kind, present: true}
          - {invariants: true}
