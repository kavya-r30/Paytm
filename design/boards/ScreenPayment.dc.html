<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    var n = 25, cells = [], seed = 1042;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    function finder(x, y, ox, oy) {
      var dx = x - ox, dy = y - oy;
      if (dx < 0 || dy < 0 || dx > 6 || dy > 6) { return null; }
      if (dx === 0 || dy === 0 || dx === 6 || dy === 6) { return true; }
      if (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4) { return true; }
      return false;
    }
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        var f = finder(x, y, 0, 0);
        if (f === null) { f = finder(x, y, n - 7, 0); }
        if (f === null) { f = finder(x, y, 0, n - 7); }
        var quiet = (x === 7 && y < 8) || (y === 7 && x < 8) || (x === n - 8 && y < 8) || (y === 7 && x > n - 9) || (x === 7 && y > n - 9) || (y === n - 8 && x < 8);
        var centre = x >= 10 && x <= 14 && y >= 10 && y <= 14;
        var on = f !== null ? f : ((quiet || centre) ? false : rnd() > 0.52);
        cells.push({ color: on ? '#0B1B33' : '#FFFFFF', r: f !== null ? '1px' : '2px' });
      }
    }
    return { cells: cells };
  }
}
